<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // Redirect all 404s to index.html for client-side routing
    // Preserve the original path so Next.js router can handle it
    var path = window.location.pathname;
    window.location.replace('/index.html#' + path);
  </script>
</head>
<body>
  Redirecting...
</body>
</html>
